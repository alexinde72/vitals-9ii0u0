name: Sync Garmin & deploy

on:
  schedule:
    - cron: "30 1 * * *"   # 09:30 Asia/Shanghai, after your watch has synced last night's sleep
  workflow_dispatch:
    inputs:
      backfill:
        description: "Days to (re)fetch. Blank = auto (364 on first run, then 10)"
        required: false
  push:
    branches: [main]
    paths: ["web/**", "sync/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt
      - id: pages
        uses: actions/configure-pages@v5

      - name: Sync from Garmin Personal API
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data.json
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ -z "$GARMIN_PERSONAL_API_KEY" ]; then echo "::error::Add the GARMIN_PERSONAL_API_KEY secret"; exit 1; fi
          if [ -n "$BACKFILL" ]; then python sync/sync.py --backfill "$BACKFILL"; else python sync/sync.py; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
