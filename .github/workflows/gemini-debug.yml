name: Gemini debug (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error
          key = os.environ["GEMINI_API_KEY"]
          H = {"x-goog-api-key": key, "content-type": "application/json"}
          ms = json.load(urllib.request.urlopen(urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", headers=H), timeout=30))["models"]
          names = [m["name"].split("/",1)[1] for m in ms if "generateContent" in m.get("supportedGenerationMethods", [])]
          print("generateContent models:", ", ".join(n for n in names if "gemini" in n))
          for model in [n for n in names if "flash" in n][:8]:
              t = time.time()
              body = json.dumps({"contents":[{"role":"user","parts":[{"text":"Reply with JSON {\"ok\": true}"}]}],
                                 "generationConfig":{"responseMimeType":"application/json","maxOutputTokens":200}}).encode()
              try:
                  r = json.load(urllib.request.urlopen(urllib.request.Request(f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent", data=body, headers=H), timeout=60))
                  txt = "".join(p.get("text","") for p in r["candidates"][0]["content"].get("parts",[]))
                  print(f"OK   {model:40} {time.time()-t:5.1f}s {txt[:40]!r} finish={r['candidates'][0].get('finishReason')}")
              except urllib.error.HTTPError as e:
                  print(f"HTTP {model:40} {time.time()-t:5.1f}s {e.code} {e.read().decode()[:160]}")
              except Exception as e:
                  print(f"ERR  {model:40} {time.time()-t:5.1f}s {e}")
