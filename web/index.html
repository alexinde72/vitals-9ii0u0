<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitals</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitals">
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="alternate icon" href="icon-192.png">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --surface:#0f1013; --surface-2:#17181c; --surface-3:#23242a; --line:rgba(255,255,255,.07); --glow:rgba(12,163,12,.0);
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781; --grid:#26262a; --axis:#38383c;
  --sleep:#9085e9; --heart:#e66767; --hrv:#199e70; --steps:#3987e5; --battery:#86b6ef;
  --stress:#d95926; --vo2:#d55181;
  --deep:#5b4bd0; --light:#9085e9; --rem:#d55181; --awake:#c3c2b7;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --bad:#d03b3b;
  --r:1.1rem;
  font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-size:1rem;line-height:1.35;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 92px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 16px}
.brand{font-weight:800;letter-spacing:.18em;font-size:.8rem;color:var(--muted);text-transform:uppercase}
h1{margin:2px 0 0;font-size:1.75rem;letter-spacing:-.02em;font-weight:800}
.meta{color:var(--muted);font-size:.78rem;text-align:right}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.badge.warn{background:rgba(250,178,25,.15);color:var(--warn)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);background:rgba(10,10,11,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--grid)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:12px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.rail-extra{display:none}

/* layout */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.span-2{grid-column:span 2}.app{max-width:1180px;margin:0 auto}}
@media (min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}.span-3{grid-column:span 3}}
@media (max-width:759px){.span-2,.span-3{grid-column:auto}}
.card{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0;position:relative;outline:none}
.card.flat{background:transparent;padding:0}
.kicker{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.kicker h2{margin:0;font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sub{color:var(--muted);font-size:.78rem}
.big{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.big small{font-size:.9rem;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:3px}
.mid{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.mid small{font-size:.75rem;color:var(--muted);font-weight:700;margin-left:2px}
.delta{font-size:.75rem;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.delta .ar{font-size:.7rem}
.delta.up-good,.delta.down-good{color:var(--ink)}
.delta i{width:6px;height:6px;border-radius:50%;display:inline-block}
.row{display:flex;gap:14px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* rings */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:18px 8px 16px}
.ring{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.ring .lab{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.ring .st{font-size:.72rem;color:var(--muted);margin-top:-4px}
.ring svg{width:100%;max-width:120px;height:auto;overflow:visible}

/* insights */
.ai h3{margin:0 0 6px;font-size:1.2rem;letter-spacing:-.01em}
.ai p{margin:0 0 12px;color:var(--ink-2);font-size:.92rem}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tips li{display:flex;gap:10px;font-size:.86rem;color:var(--ink)}
.tips li:before{content:"";flex:none;width:6px;height:6px;margin-top:.45em;border-radius:50%;background:var(--steps)}
.ins{display:grid;gap:10px}
.insight{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:12px}
.insight .ic{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:.85rem;color:#0a0a0b}
.insight b{display:block;font-size:.88rem;margin-bottom:2px}
.insight span{font-size:.8rem;color:var(--ink-2)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;outline:none}
.tile .t{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.spark{height:30px}

/* segmented control */
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 10px;border-radius:8px;font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.seg button.on{background:var(--surface-3);color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px;gap:10px;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:1.25rem;font-weight:800;letter-spacing:-.01em}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.74rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;border-radius:2px;width:14px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#242428;border:1px solid #333338;border-radius:10px;padding:8px 10px;font-size:.78rem;
  box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .1s;max-width:240px}
#tip b{display:block;margin-bottom:3px;font-size:.74rem;color:var(--ink-2)}
#tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
#tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
.stats.c3{grid-template-columns:repeat(3,1fr)}
.stats.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.stats.c4{grid-template-columns:repeat(2,1fr)}}
.stat .l{font-size:.68rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.stat .v{font-size:1.1rem;font-weight:800}
.stat .v small{font-size:.72rem;color:var(--muted);margin-left:2px}

/* stage bar */
.stages{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 10px}
.stages i{display:block;height:100%}
.stagelist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stagelist div{font-size:.72rem;color:var(--muted)}
.stagelist b{display:block;font-size:.95rem;color:var(--ink)}
.stagelist em{font-style:normal;display:inline-flex;align-items:center;gap:5px}

/* activities */
.acts{display:grid;gap:8px}
.act{display:block;background:var(--surface-2);border-radius:14px;padding:12px;outline:none;text-align:left;width:100%}
.act-g{display:grid;grid-template-columns:auto 1fr auto;grid-gap:12px;align-items:center}
.act .ty{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:.6rem;font-weight:900;letter-spacing:.06em;color:#0a0a0b}
.act .nm{font-weight:800;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .dt{font-size:.74rem;color:var(--muted)}
.act .nums{display:flex;gap:14px;text-align:right}
.act .nums div{font-size:.95rem;font-weight:800}
.act .nums small{display:block;font-size:.62rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.act-detail{grid-column:1/-1;display:none;padding-top:8px;border-top:1px solid var(--grid);margin-top:4px}
.act.open .act-detail{display:block}
.zones{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 6px}
@media (max-width:420px){.act .nums div:nth-child(3){display:none}}

/* heatmap */
.heat{overflow-x:auto}
.heat svg rect{shape-rendering:crispEdges}

.records{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.records{grid-template-columns:repeat(3,1fr)}}
.rec{background:var(--surface-2);border-radius:14px;padding:12px}
.rec .l{font-size:.66rem;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.rec .v{font-size:1.25rem;font-weight:800;margin:4px 0 2px}
.rec .d{font-size:.72rem;color:var(--ink-2)}

table.cmp{width:100%;border-collapse:collapse;font-size:.86rem}
table.cmp th{font-size:.66rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;text-align:right;font-weight:800;padding:0 0 8px}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp td{padding:9px 0;border-top:1px solid var(--grid);text-align:right;font-weight:700}
table.cmp td:first-child{color:var(--ink-2);font-weight:600}

.empty{color:var(--muted);font-size:.85rem;padding:20px 0;text-align:center}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted)}
.view{animation:fade .25s ease}
.view.still{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------------- TV (10-foot) mode ---------------- */
body.tv{overflow:hidden}
body.tv .app{max-width:none;margin:0;padding:2.2rem 2.6rem 2rem 15.5rem;height:100vh;overflow-y:auto;scroll-behavior:smooth;scrollbar-width:none}
body.tv .app::-webkit-scrollbar{display:none}
body.tv nav.tabs{top:0;bottom:0;right:auto;width:13rem;flex-direction:column;justify-content:flex-start;gap:.4rem;padding:2.2rem 1.1rem;border-top:0;border-right:1px solid var(--grid);background:#0d0d0f}

body.tv .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:.9rem;padding:.85rem .9rem;font-size:.85rem}
body.tv .tab svg{width:1.4rem;height:1.4rem}
body.tv .rail-extra{display:block;margin-top:auto;padding:0 .9rem;color:var(--muted);font-size:.78rem}
body.tv .rail-extra .clock{font-size:2.2rem;font-weight:800;color:var(--ink);letter-spacing:-.02em}
body.tv .grid{grid-template-columns:repeat(12,1fr);gap:1.1rem}
body.tv .grid>*{grid-column:span 4}
body.tv .grid>.tv-3{grid-column:span 3}
body.tv .grid>.tv-5{grid-column:span 5}
body.tv .grid>.tv-6{grid-column:span 6}
body.tv .grid>.tv-7{grid-column:span 7}
body.tv .grid>.tv-8{grid-column:span 8}
body.tv .grid>.tv-12{grid-column:span 12}
body.tv .tiles{grid-template-columns:repeat(4,1fr);gap:1.1rem}
body.tv .card,body.tv .tile{padding:1.3rem;transition:transform .15s, box-shadow .15s}
body.tv header.top{margin-bottom:1.4rem}
body.tv .hero .ring svg{max-width:10rem}
body.tv .records{grid-template-columns:repeat(3,1fr)}
body.tv .stats.c4{grid-template-columns:repeat(4,1fr)}
body.tv :focus{outline:none}
body.tv .chart text{font-size:.66rem}
body.tv .hero .ring svg{max-width:11.5rem}
body.tv .tab:focus,body.tv .tab.on:focus{background:var(--surface-3);color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
body.tv .tab.on{color:var(--ink)}
body.tv .card:focus,body.tv .tile:focus,body.tv .act:focus{box-shadow:0 0 0 3px var(--ink);transform:scale(1.015)}
body.tv .seg button:focus{box-shadow:0 0 0 2px var(--ink);color:var(--ink)}
#ambientBar{position:fixed;top:0;left:0;height:3px;background:var(--ink);opacity:.5;width:0;z-index:30;display:none}
body.ambient #ambientBar{display:block}
body.ambient nav.tabs{opacity:.35}

/* ---------------- bold layer ---------------- */
body{background:radial-gradient(130% 55% at 50% -12%, var(--glow), transparent 62%) no-repeat, #000;background-attachment:fixed}
body.tv{background:radial-gradient(70% 70% at 30% -20%, var(--glow), transparent 60%) no-repeat, #000}
.card,.tile{background:linear-gradient(180deg,#121317 0%,#0c0d10 100%);border:1px solid var(--line)}
.card.hero-card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));}
h1,.big,.mid,.stat .v,.rec .v,.act .nums div,.act .nm,.ring .lab,.kicker h2,.tile .t,.toolbar h2,.brand,.seg button,.tab,.ai h3,table.cmp td,.stagelist b,.rail-extra .clock{font-family:var(--cond)}
h1{font-size:2.3rem;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.brand{font-size:.85rem;letter-spacing:.22em;font-weight:700}
.kicker h2{font-size:.95rem;font-weight:700;letter-spacing:.12em;color:var(--ink)}
.tile .t{font-size:.9rem;font-weight:700;letter-spacing:.12em;color:var(--ink)}
.big{font-size:3.4rem;font-weight:700;letter-spacing:-.01em;line-height:.9}
.big small{font-family:var(--cond);font-size:1.05rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mid{font-size:2.1rem;font-weight:700;letter-spacing:0}
.mid small{font-family:var(--cond);font-size:.9rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:1.55rem;font-weight:700}
.stat .v small{font-family:var(--cond);font-size:.85rem;text-transform:uppercase;font-weight:600}
.stat .l,.rec .l{letter-spacing:.12em}
.rec .v{font-size:1.9rem;font-weight:700}
.act .nm{font-size:1.15rem;font-weight:700;letter-spacing:.01em}
.act .nums div{font-size:1.35rem;font-weight:700}
.ai h3{font-size:1.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin-bottom:10px}
.toolbar h2{font-size:2rem;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.seg button{font-size:.9rem;font-weight:700;letter-spacing:.08em;padding:5px 12px}
.tab{font-size:.78rem;letter-spacing:.1em}
.tab.on{color:var(--ink)} .tab.on svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.55))}
.hero{grid-template-columns:1fr 1.32fr 1fr;align-items:center;gap:4px;padding:22px 4px 18px}
.ring svg{max-width:132px}
.ring.main svg{max-width:178px}
.ring .lab{font-size:.95rem;font-weight:700;letter-spacing:.14em}
.ring.main .lab{font-size:1.1rem}
.ring .st{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:-6px}
.bar{height:8px}
.insight{background:rgba(255,255,255,.04);border:1px solid var(--line)}
.insight b{font-family:var(--cond);font-size:1.12rem;font-weight:700;letter-spacing:.01em}
.act{background:rgba(255,255,255,.035);border:1px solid var(--line)}
.act .ty{font-family:var(--cond);font-size:.8rem;letter-spacing:.08em}
.chart .glow{filter:drop-shadow(0 0 5px var(--c))}
body.tv .hero .ring svg{max-width:12rem}
body.tv .hero .ring.main svg{max-width:15.5rem}
body.tv .big{font-size:3.8rem}
body.tv .ai p{font-size:1.1rem}
body.tv .tips li{font-size:1.02rem}
body.tv .insight span{font-size:.92rem}
body.tv .sub,body.tv .delta{font-size:.85rem}
body.tv .tab{font-size:1rem}

body.tv .rail-extra .clock{font-size:3rem;font-weight:700}
@media (max-width:420px){.big{font-size:2.9rem}.ring.main svg{max-width:150px}.ring .lab{font-size:.8rem}.ring.main .lab{font-size:.95rem}.ring .st{font-size:.7rem}}

/* ---------- fallbacks for browsers without flexbox gap (Chrome < 84, e.g. TV WebViews) ---------- */
.nogap .kicker>*+*,.nogap .between>*+*,.nogap .row>*+*{margin-left:10px}
.nogap .kicker h2>*+*,.nogap .tile .t>*+*,.nogap .legend span>*+*,.nogap .delta>*+*,.nogap .stagelist em>*+*{margin-left:7px}
.nogap .legend>*+*{margin-left:12px}
.nogap .act .nums>*+*{margin-left:14px}
.nogap .stages>*+*,.nogap .zones>*+*{margin-left:2px}
.nogap .seg>*+*{margin-left:2px}
.nogap .insight>*+*{margin-left:12px}
.nogap .tab>*+*{margin-left:.9rem}
.nogap nav.tabs .tab{margin-bottom:.4rem}
.nogap .ring>*+*{margin-top:8px}
.nogap .tile>*+*{margin-top:8px}
.nogap .tips li>*+*{margin-left:10px}
.nogap .dot{margin-right:8px}
.nogap .tab svg{margin-right:.9rem}
.nogap .delta i,.nogap .delta .ar{margin-right:5px}
.nogap .tips li:before{margin-right:10px}
.nogap .legend i{margin-right:6px}
.nogap #tip .r i{margin-right:6px}

/* ---------- layout fixes ---------- */
.kicker{flex-wrap:wrap}
.kicker h2{white-space:nowrap}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap}
.chart svg{touch-action:pan-y}


/* ---------- brand: wordmark, mark, boot screen ---------- */
.wordmark{display:block;height:13px;width:auto;fill:currentColor;color:var(--ink)}
.mark{display:block;fill:currentColor;color:var(--ink)}
.brandrow{display:flex;align-items:center;color:var(--muted);font-family:var(--cond);font-weight:700;letter-spacing:.2em;font-size:.8rem}
.brandrow .wordmark{height:12px;margin-right:10px;color:var(--ink)}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease, visibility .5s}
#splash.gone{opacity:0;visibility:hidden}
.splash-in{display:flex;flex-direction:column;align-items:center}
.splash-mark{width:84px;height:84px;color:#fff;animation:splashIn .9s cubic-bezier(.2,.8,.2,1) both}
.splash-word{height:22px;margin-top:26px;color:#fff;animation:splashIn .9s .15s cubic-bezier(.2,.8,.2,1) both}
.splash-bar{width:120px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:30px;overflow:hidden}
.splash-bar i{display:block;height:100%;width:40%;background:#fff;border-radius:2px;animation:splashBar 1.1s ease-in-out infinite}
@keyframes splashIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes splashBar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
body.tv .splash-mark{width:9rem;height:9rem}
body.tv .splash-word{height:2.6rem;margin-top:2.6rem}
body.tv .splash-bar{width:14rem;margin-top:3rem}
.rail-logo{padding:0 .9rem 1.8rem;color:var(--ink)}
.rail-logo .wordmark{height:1.15rem;color:var(--ink)}

/* ---------- stacked cards & wide Vitals Age ---------- */
.stack{display:flex;flex-direction:column;min-width:0}
.stack>.card{flex:1 1 auto}
.stack>.card+.card{margin-top:12px}
body.tv .stack>.card+.card{margin-top:1.1rem}

};

/* ============================================================ state */
let DATA = null, DAYS = [], TODAY = null, HIST = [];
const state = { view: (location.hash.slice(1) || "today"), range: 30, heat: "steps", openAct: null };
const VIEWS = ["today","sleep","heart","activity","trends"];
if (!VIEWS.includes(state.view)) state.view = "today";

function setData(d){
  DATA = d; DAYS = d.days || [];
  TODAY = DAYS[DAYS.length-1] || {};
  HIST = DAYS.slice(0, -1); // completed days, for baselines
}
const lastN = (n, arr=DAYS) => arr.slice(Math.max(0, arr.length - n));
const base = (fn, n=30) => mean(lastN(n, HIST).map(fn));

/* ============================================================ tooltip */
const tip = $("#tip");
function showTip(html, x, y){
  clearTimeout(tipTimer);
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 12;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top < 8) top = y + 16;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
let tipTimer = null;
function hideTip(){
  clearTimeout(tipTimer); tip.style.opacity = 0;
  document.querySelectorAll(".chart .hov").forEach(h => { h.style.display = "none"; });
  document.querySelectorAll(".chart .hl").forEach(h => h.setAttribute("opacity", 0));
  if (window.__onHideTip) window.__onHideTip();
}
// Touch: keep the readout briefly after lifting the finger, then clear it so it never gets stuck
function tipRelease(e){ if (e.pointerType !== "mouse") { clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 1500); } }
addEventListener("scroll", hideTip, {passive: true});
document.addEventListener("pointerdown", e => { if (!e.target.closest(".chart, .heat")) hideTip(); }, {passive: true});
const tipRow = (color, label, val) => `<div class="r"><span><i style="background:${color}"></i>${label}</span><strong>${val}</strong></div>`;

/* ============================================================ chart kit */
function niceTicks(min, max, count=4){
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / count, mag = 10 ** Math.floor(Math.log10(step0));
  const err = step0 / mag, step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step, t = [];
  for (let v = lo; v <= hi + step/2; v += step) t.push(+v.toFixed(10));
  return t;
}
function topRounded(x, y, w, h, r){
  if (h <= 0) return "";
  r = Math.min(r, w/2, h);
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
}
function chartBox(el, h){
  const w = Math.max(200, el.clientWidth);
  const s = TV ? rem()/16 : 1;
  return { w, h: Math.round(h * s), s, m: { l: Math.round(34*s), r: Math.round(8*s), t: Math.round(10*s), b: Math.round(22*s) } };
}
function dateTicks(xs, w){
  const n = xs.length, want = Math.max(2, Math.min(6, Math.floor(w / 80)));
  const idx = []; for (let k = 0; k < want; k++) idx.push(Math.round(k * (n-1) / (want-1)));
  return [...new Set(idx)];
}
function xLabelFor(d, spanDays){
  return spanDays > 120 ? MON[d.getMonth()] : fDate(d);
}

/**
 * Line chart. opts: {xs:[Date|number], kind:'date'|'minute', series:[{ys, color, w, dots, area, label, dash, opacity}],
 *  band:{lo,hi,color}, ref:{y,label}, h, yMin, yMax, yFmt, tip:(i)=>html}
 */
function lineChart(el, o){
  if (!el || !el.isConnected) return;
  const {w, h, s, m} = chartBox(el, o.h || 170);
  const xs = o.xs, n = xs.length;
  if (!n) { el.innerHTML = `<div class="empty">No data yet</div>`; return; }
  const all = o.series.flatMap(sr => sr.ys).filter(v => v != null);
  if (o.band) { const lo = [].concat(o.band.lo), hi = [].concat(o.band.hi); all.push(...lo.filter(v=>v!=null), ...hi.filter(v=>v!=null)); }
  if (o.ref) all.push(o.ref.y);
  if (!all.length) { el.innerHTML = `<div class="empty">No data in this range</div>`; return; }
  let lo = o.yMin ?? Math.min(...all), hi = o.yMax ?? Math.max(...all);
  const pad = (hi - lo) * 0.08 || 1; if (o.yMin == null) lo -= pad; if (o.yMax == null) hi += pad;
  const ticks = niceTicks(lo, hi, o.ticks || 4).filter(t => t >= lo - 1e-9 && t <= hi + 1e-9);
  const xv = xs.map(x => x instanceof Date ? x.getTime() : x);
  const x0 = o.xMin ?? xv[0], x1 = o.xMax ?? xv[n-1];
  const X = v => m.l + (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)) * (w - m.l - m.r);
  const Y = o.invert ? (v => m.t + ((v - lo) / (hi - lo)) * (h - m.t - m.b)) : (v => m.t + (1 - (v - lo) / (hi - lo)) * (h - m.t - m.b));
  const yFmt = o.yFmt || (v => fNum(v));
  let g = "";
  ticks.forEach(t => { g += `<line x1="${m.l}" x2="${w-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${C.grid}"/><text x="${m.l-6}" y="${Y(t)+3.5}" text-anchor="end">${yFmt(t)}</text>`; });
  // x labels
  if (o.kind === "minute") {
    for (let hr = 0; hr <= 24; hr += 6) { const v = hr*60; if (v < x0 || v > x1) continue; g += `<text x="${X(v)}" y="${h-6}" text-anchor="${hr===0?"start":hr===24?"end":"middle"}">${String(hr).padStart(2,"0")}:00</text>`; }
  } else {
    const span = (x1 - x0) / 864e5;
    dateTicks(xs, w).forEach((i, k, arr) => g += `<text x="${X(xv[i])}" y="${h-6}" text-anchor="${k===0?"start":k===arr.length-1?"end":"middle"}">${o.xFmt ? o.xFmt(xs[i]) : xLabelFor(xs[i], span)}</text>`);
  }
  if (o.band) {
    const blo = Array.isArray(o.band.lo) ? o.band.lo : xv.map(() => o.band.lo), bhi = Array.isArray(o.band.hi) ? o.band.hi : xv.map(() => o.band.hi);
    let top = "", bot = "";
    xv.forEach((v, i) => { if (blo[i] != null && bhi[i] != null) { top += (top ? "L" : "M") + X(v) + "," + Y(bhi[i]); } });
    for (let i = n-1; i >= 0; i--) if (blo[i] != null && bhi[i] != null) bot += "L" + X(xv[i]) + "," + Y(blo[i]);
    if (top) g += `<path d="${top}${bot}Z" fill="${o.band.color || C.ink}" opacity=".09"/>`;
  }
  if (o.ref) g += `<line x1="${m.l}" x2="${w-m.r}" y1="${Y(o.ref.y)}" y2="${Y(o.ref.y)}" stroke="${C.ink2}" stroke-dasharray="3 4" opacity=".6"/><text x="${w-m.r}" y="${Y(o.ref.y)-5}" text-anchor="end" style="fill:${C.ink2}">${esc(o.ref.label||"")}</text>`;
  o.series.forEach(sr => {
    const pts = [];
    let d = "", seg = false;
    sr.ys.forEach((v, i) => {
      if (v == null) { seg = false; return; }
      const yc = Y(clamp(v, lo, hi)); d += (seg ? "L" : "M") + X(xv[i]).toFixed(1) + "," + yc.toFixed(1); seg = true; pts.push([X(xv[i]), yc]);
    });
    if (sr.area && pts.length) {
      const id = "g" + Math.random().toString(36).slice(2,8);
      g += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sr.color}" stop-opacity=".5"/><stop offset="1" stop-color="${sr.color}" stop-opacity="0"/></linearGradient></defs>`;
      g += `<path d="M${pts[0][0]},${Y(lo)}L${pts.map(p=>p.join(",")).join("L")}L${pts[pts.length-1][0]},${Y(lo)}Z" fill="url(#${id})"/>`;
    }
    if (sr.dots) pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="${(sr.r||2.2)*s}" fill="${sr.color}" opacity="${sr.opacity ?? .45}"/>`);
    if (!sr.dotsOnly) g += `<path class="${sr.glow === false ? "" : "glow"}" style="--c:${sr.color}" d="${d}" fill="none" stroke="${sr.color}" stroke-width="${(sr.w||2)*s}" stroke-linejoin="round" stroke-linecap="round" ${sr.dash?`stroke-dasharray="${sr.dash}"`:""} opacity="${sr.lineOpacity ?? 1}"/>`;
  });
  if (o.endLabel) {
    const sr = o.series[o.endLabel.series || 0]; let i = n-1; while (i >= 0 && sr.ys[i] == null) i--;
    if (i >= 0) g += `<circle cx="${X(xv[i])}" cy="${Y(sr.ys[i])}" r="${4*s}" fill="${sr.color}" stroke="${C.ink}" stroke-width="${1.5*s}"/>`;
  }
  g += `<g class="hov" style="display:none"><line y1="${m.t}" y2="${h-m.b}" stroke="${C.ink2}" stroke-width="1" opacity=".5"/>${o.series.map(sr=>`<circle r="${4*s}" fill="${sr.color}" stroke="${C.ink}" stroke-width="1.5"/>`).join("")}</g>`;
  g += `<rect class="hit" x="${m.l}" y="0" width="${w-m.l-m.r}" height="${h}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" height="${h}">${g}</svg>`;
  if (!o.tip || TV) return;
  const svg = el.querySelector("svg"), hov = svg.querySelector(".hov"), line = hov.querySelector("line"), dots = hov.querySelectorAll("circle");
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (w / r.width);
    const v = x0 + (px - m.l) / (w - m.l - m.r) * (x1 - x0);
    let bi = 0, bd = Infinity; xv.forEach((xx, i) => { const dd = Math.abs(xx - v); if (dd < bd) { bd = dd; bi = i; } });
    hov.style.display = ""; line.setAttribute("x1", X(xv[bi])); line.setAttribute("x2", X(xv[bi]));
    o.series.forEach((sr, k) => { const yv = sr.ys[bi]; dots[k].style.display = yv == null ? "none" : ""; if (yv != null) { dots[k].setAttribute("cx", X(xv[bi])); dots[k].setAttribute("cy", Y(yv)); } });
    showTip(o.tip(bi), e.clientX, e.clientY);
    if (o.onIndex) o.onIndex(bi);
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideTip(); });
  svg.addEventListener("pointerup", tipRelease); svg.addEventListener("pointercancel", hideTip);
}

/**
 * Bar chart (optionally stacked / floating). opts: {xs:[Date], stacks:[{ys, color, label}], base:[] (floating start), goal, h, yFmt, tip}
 */
function barChart(el, o){
  if (!el || !el.isConnected) return;
  const {w, h, s, m} = chartBox(el, o.h || 170);
  const n = o.xs.length;
  if (!n) { el.innerHTML = `<div class="empty">No data yet</div>`; return; }
  const tot = o.xs.map((_, i) => o.stacks.reduce((a, st) => a + (st.ys[i] || 0), 0) + (o.base ? (o.base[i] || 0) : 0));
  let hi = Math.max(...tot, o.goal || 0) * 1.08 || 1, lo = o.yMin ?? 0;
  if (o.base) lo = o.yMin ?? Math.max(0, Math.min(...o.base.filter(v=>v!=null)) - 5);
  const ticks = niceTicks(lo, hi, 4).filter(t => t >= lo && t <= hi);
  const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * (h - m.t - m.b);
  const bw = (w - m.l - m.r) / n, gap = Math.min(bw * 0.3, 2 * s + (bw > 14 ? 2 : 0)), barW = Math.max(1, bw - gap);
  const yFmt = o.yFmt || (v => fNum(v));
  let g = "";
  ticks.forEach(t => g += `<line x1="${m.l}" x2="${w-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${C.grid}"/><text x="${m.l-6}" y="${Y(t)+3.5}" text-anchor="end">${yFmt(t)}</text>`);
  const span = (o.xs[n-1] - o.xs[0]) / 864e5;
  dateTicks(o.xs, w).forEach((i, k, arr) => g += `<text x="${m.l + bw*i + bw/2}" y="${h-6}" text-anchor="${k===0?"start":k===arr.length-1?"end":"middle"}">${o.xFmt ? o.xFmt(o.xs[i]) : xLabelFor(o.xs[i], span)}</text>`);
  o.xs.forEach((_, i) => {
    let acc = o.base ? (o.base[i] ?? lo) : 0;
    const x = m.l + bw * i + gap / 2;
    const visible = o.stacks.map((st, k) => [k, st.ys[i] || 0]).filter(p => p[1] > 0);
    visible.forEach(([k, v], j) => {
      const st = o.stacks[k];
      const y0 = Y(acc), y1 = Y(acc + v);
      const hh = y0 - y1 - (j < visible.length - 1 ? Math.min(2*s, (y0-y1)/3) : 0);
      const isTop = j === visible.length - 1;
      const col = typeof st.color === "function" ? st.color(i) : st.color;
      g += isTop ? `<path d="${topRounded(x, y1, barW, hh, Math.min(4*s, barW/2))}" fill="${col}" opacity="${st.opacity ?? 1}"/>`
                 : `<rect x="${x}" y="${y0-hh}" width="${barW}" height="${hh}" fill="${col}" opacity="${st.opacity ?? 1}"/>`;
      acc += v;
    });
  });
  if (o.goal) g += `<line x1="${m.l}" x2="${w-m.r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="${C.ink}" stroke-dasharray="3 4" opacity=".55"/><text x="${w-m.r}" y="${Y(o.goal)-5}" text-anchor="end" style="fill:${C.ink2}">${esc(o.goalLabel || "Goal")}</text>`;
  g += `<rect class="hl" y="${m.t}" height="${h-m.t-m.b}" width="${bw}" fill="${C.ink}" opacity="0" rx="3"/>`;
  g += `<rect class="hit" x="${m.l}" y="0" width="${w-m.l-m.r}" height="${h}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" height="${h}">${g}</svg>`;
  if (!o.tip || TV) return;
  const svg = el.querySelector("svg"), hl = svg.querySelector(".hl");
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (w / r.width);
    const i = clamp(Math.floor((px - m.l) / bw), 0, n-1);
    hl.setAttribute("x", m.l + bw * i); hl.setAttribute("opacity", .06);
    showTip(o.tip(i), e.clientX, e.clientY);
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideTip(); });
  svg.addEventListener("pointerup", tipRelease); svg.addEventListener("pointercancel", hideTip);
}

function ring(value, max, color, label, status, opts = {}){
  const R = 50, sw = opts.main ? 10 : 9, c = 2 * Math.PI * R, f = value == null ? 0 : clamp(value / max, 0, 1);
  const unit = opts.unit || "";
  return `<div class="ring ${opts.main ? "main" : ""}">
    <svg viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="${color}" stroke-opacity=".14" stroke-width="${sw}"/>
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 ${opts.main ? 7 : 5}px ${color})"/>
    <text x="60" y="${unit ? 71 : 72}" text-anchor="middle" fill="${C.ink}" font-size="${opts.main ? 40 : 38}" font-weight="700" font-family="Barlow Condensed,Arial Narrow,sans-serif">${value == null ? "–" : Math.round(value)}<tspan font-size="${opts.main ? 18 : 16}" dx="1" fill="${C.ink2}">${value == null ? "" : unit}</tspan></text>
    </svg><div class="lab">${label}</div><div class="st" style="color:${color}">${esc(status || "")}</div></div>`;
}

function spark(el, ys, color){
  if (!el || !el.isConnected) return;
  const w = Math.max(80, el.clientWidth), h = el.clientHeight || 30;
  const v = ys.filter(x => x != null); if (v.length < 2) { el.innerHTML = ""; return; }
  const lo = Math.min(...v), hi = Math.max(...v), X = i => i / (ys.length - 1) * (w - 4) + 2, Y = y => h - 3 - (y - lo) / ((hi - lo) || 1) * (h - 6);
  let d = "", on = false; ys.forEach((y, i) => { if (y == null) { on = false; return; } d += (on ? "L" : "M") + X(i).toFixed(1) + "," + Y(y).toFixed(1); on = true; });
  const li = ys.length - 1 - [...ys].reverse().findIndex(y => y != null);
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(li)}" cy="${Y(ys[li])}" r="3" fill="${color}"/></svg>`;
}

function hypnogram(el, segs){
  if (!el || !el.isConnected) return;
  const {w, h: hh, s} = chartBox(el, 130), m = {l: 46*s, r: 6*s, t: 6*s, b: 22*s};
  const h = hh;
  if (!segs || !segs.length) { el.innerHTML = `<div class="empty">No sleep stages for last night</div>`; return; }
  const parse = x => new Date(x).getTime();
  const t0 = parse(segs[0][0]), t1 = parse(segs[segs.length-1][1]);
  const lanes = [[3,"Awake",C.awake],[2,"REM",C.rem],[1,"Light",C.light],[0,"Deep",C.deep]];
  const lh = (h - m.t - m.b) / 4, X = t => m.l + (t - t0) / (t1 - t0) * (w - m.l - m.r);
  let g = "";
  lanes.forEach(([k, lab], j) => g += `<text x="0" y="${m.t + lh*j + lh/2 + 3.5}">${lab}</text><line x1="${m.l}" x2="${w-m.r}" y1="${m.t+lh*(j+1)}" y2="${m.t+lh*(j+1)}" stroke="${C.grid}"/>`);
  segs.forEach(([a, b, st]) => {
    const j = lanes.findIndex(l => l[0] === st); if (j < 0) return;
    const x = X(parse(a)), x2 = X(parse(b));
    g += `<rect x="${x}" y="${m.t + lh*j + 3*s}" width="${Math.max(1, x2 - x - 1)}" height="${lh - 6*s}" rx="${3*s}" fill="${lanes[j][2]}"><title>${lanes[j][1]} ${fClock(new Date(parse(a)))}–${fClock(new Date(parse(b)))}</title></rect>`;
  });
  const hours = []; const start = new Date(t0); start.setMinutes(0,0,0);
  for (let t = start.getTime() + 36e5; t < t1; t += 36e5) hours.push(t);
  const every = Math.ceil(hours.length / Math.max(2, Math.floor(w / 70)));
  hours.forEach((t, i) => { if (i % every === 0) g += `<text x="${X(t)}" y="${h-6}" text-anchor="middle">${fClock(new Date(t))}</text>`; });
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" height="${h}">${g}</svg>`;
}

function heatmap(el, fn, color, fmt){
  if (!el || !el.isConnected) return;
  const days = lastN(371, HIST.concat([TODAY]));
  if (!days.length) return;
  const s = TV ? rem()/16 : 1, avail = el.clientWidth;
  const first = pd(days[0].date), offset = first.getDay();
  const weeks = Math.ceil((days.length + offset) / 7);
  const cell = Math.max(5, Math.min((TV ? 30 : 16)*s, Math.floor((avail - 30*s) / weeks) - 2)), gap = Math.max(1.5, cell * 0.18);
  const w = 30*s + weeks * (cell + gap), h = 18*s + 7 * (cell + gap);
  const vals = days.map(fn).filter(v => v != null);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const steps = ["#cde2fb","#86b6ef","#3987e5","#1c5cab","#0d366b"].reverse(); // dark surface: light = high
  const ramp = color === "violet" ? ["#2a2560","#41389a","#6250d6","#9085e9","#c9c2f6"] : color === "aqua" ? ["#0c3a2b","#10603f","#199e70","#4fd1a1","#a5ecd0"] : ["#0d366b","#1c5cab","#3987e5","#86b6ef","#cde2fb"];
  let g = "";
  ["Mon","Wed","Fri"].forEach((l, k) => g += `<text x="0" y="${18*s + (1 + k*2) * (cell+gap) + cell*0.8}" font-size="${9*s}">${l}</text>`);
  let lastMonth = -1;
  days.forEach((d, i) => {
    const k = i + offset, wk = Math.floor(k / 7), dow = k % 7, dt = pd(d.date), v = fn(d);
    const x = 30*s + wk * (cell + gap), y = 18*s + dow * (cell + gap);
    if (dt.getDate() <= 7 && dt.getMonth() !== lastMonth && dow === 0) { lastMonth = dt.getMonth(); g += `<text x="${x}" y="${11*s}" font-size="${9.5*s}">${MON[lastMonth]}</text>`; }
    const q = v == null ? -1 : clamp(Math.floor((v - lo) / ((hi - lo) || 1) * 5), 0, 4);
    g += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="${Math.min(3, cell/4)}" fill="${q < 0 ? C.surface2 || "#1e1e21" : ramp[q]}" data-i="${i}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="max-width:none">${g}</svg>
    <div class="legend" style="align-items:center">Less ${ramp.map(c=>`<i style="background:${c}"></i>`).join("")} More <span class="sub" style="margin-left:auto">${fmt(lo)} – ${fmt(hi)}</span></div>`;
  if (TV) return;
  const svg = el.querySelector("svg");
  svg.addEventListener("pointermove", e => { const i = e.target.dataset?.i; if (i == null) { hideTip(); return; } const d = days[+i]; showTip(`<b>${fDay(pd(d.date))}</b>${fmt(fn(d))}`, e.clientX, e.clientY); });
  svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideTip(); });
  svg.addEventListener("pointerup", tipRelease);
}

/* ============================================================ insights (rule-based) */
function ruleInsights(){
  const out = [], push = (tone, icon, title, text) => out.push({tone, icon, title, text});
  const t = TODAY, last7 = lastN(7, HIST), prev7 = HIST.slice(-14, -7), last30 = lastN(30, HIST);

  // HRV vs baseline
  const hrvN = M.hrv(t), hrvB = base(M.hrv, 30), hrvSd = sd(last30.map(M.hrv));
  if (hrvN && hrvB) {
    const z = hrvSd ? (hrvN - hrvB) / hrvSd : 0, p = pct(hrvN, hrvB);
    if (z <= -1) push("bad", "↓", `HRV ${Math.abs(p).toFixed(0)}% below baseline`, `Last night ${hrvN} ms vs ${hrvB.toFixed(0)} ms 30-day average. Your body is under strain; favour recovery today.`);
    else if (z >= 1) push("good", "↑", `HRV ${p.toFixed(0)}% above baseline`, `Last night ${hrvN} ms vs ${hrvB.toFixed(0)} ms average. You're well recovered; a good day for intensity.`);
    else push("neutral", "≈", "HRV within your normal range", `${hrvN} ms last night, 30-day average ${hrvB.toFixed(0)} ms.`);
  }
  // Resting HR
  const rhrB = base(M.rhr, 30);
  if (t.rhr && rhrB && t.rhr - rhrB >= 3) push("warn", "♥", `Resting HR up ${Math.round(t.rhr - rhrB)} bpm`, `${t.rhr} bpm vs ${rhrB.toFixed(0)} usual. Elevated RHR can signal fatigue, alcohol, illness or late meals.`);
  else if (t.rhr && rhrB && rhrB - t.rhr >= 2) push("good", "♥", `Resting HR ${Math.round(rhrB - t.rhr)} bpm below average`, `${t.rhr} bpm today, a sign of good recovery.`);
  // Sleep debt
  const need = mean(last7.map(d => d.sleep?.need)) || 8*3600;
  const got = mean(last7.map(d => d.sleep?.total));
  if (got != null) {
    const debt = (need - got) * 7;
    if (debt > 3*3600) push("warn", "z", `${fDur(debt)} sleep debt this week`, `You've averaged ${fDur(got)} a night against a need of about ${fDur(need)}.`);
    else if (debt < 0) push("good", "z", "Sleep need met this week", `Averaging ${fDur(got)} a night. Keep it going.`);
  }
  // Bedtime consistency
  const beds = last7.map(d => d.sleep?.start ? minutesFrom18(new Date(d.sleep.start)) : null);
  const bsd = sd(beds);
  if (bsd != null) {
    if (bsd > 50) push("warn", "◷", "Irregular bedtime", `Your bedtime varied by ±${Math.round(bsd)} min this week. A consistent schedule improves deep sleep.`);
    else if (bsd < 25) push("good", "◷", "Consistent sleep schedule", `Bedtime within ±${Math.round(bsd)} min all week.`);
  }
  // Steps trend
  const s7 = mean(last7.map(M.steps)), sp7 = mean(prev7.map(M.steps));
  if (s7 && sp7) {
    const p = pct(s7, sp7);
    if (Math.abs(p) >= 10) push(p > 0 ? "good" : "warn", "⇡", `Steps ${p > 0 ? "up" : "down"} ${Math.abs(p).toFixed(0)}% week on week`, `${fNum(s7)} per day this week vs ${fNum(sp7)} the week before.`);
  }
  let streak = 0; for (let i = HIST.length - 1; i >= 0; i--) { const d = HIST[i]; if (d.steps && d.steps >= (d.stepGoal || 10000)) streak++; else break; }
  if (streak >= 3) push("good", "★", `${streak}-day step goal streak`, `You've hit your step goal ${streak} days in a row.`);
  // Training load (acute:chronic)
  const acts = DATA.activities || [], now = Date.now();
  const loadIn = (a, b) => acts.filter(x => { const t0 = new Date(x.start).getTime(); return now - t0 >= a*864e5 && now - t0 < b*864e5; }).reduce((s, x) => s + (x.load || 0), 0);
  const acute = loadIn(0, 7), chronic = loadIn(0, 28) / 4;
  if (chronic > 0) {
    const r = acute / chronic;
    if (r > 1.4) push("warn", "▲", "Training load spiking", `This week's load is ${(r*100-100).toFixed(0)}% above your 4-week average. Injury risk rises above ~1.5×.`);
    else if (r < 0.7) push("neutral", "▼", "Lighter training week", `Load is ${(100 - r*100).toFixed(0)}% below your 4-week average. Fine for recovery, but fitness fades if it lasts.`);
    else push("good", "▲", "Training load in the sweet spot", `Acute:chronic ratio ${r.toFixed(2)}, steady and sustainable.`);
  }
  // VO2 trend
  const v90 = lastN(90, HIST).map(M.vo2).filter(v => v != null);
  if (v90.length > 20) { const dlt = v90[v90.length-1] - v90[0]; if (Math.abs(dlt) >= 0.5) push(dlt > 0 ? "good" : "warn", "◆", `VO₂ max ${dlt > 0 ? "+" : ""}${dlt.toFixed(1)} in 90 days`, `Now ${v90[v90.length-1].toFixed(1)} ml/kg/min.`); }
  // Best sleep weekday
  const byWd = [0,1,2,3,4,5,6].map(k => mean(lastN(90, HIST).filter(d => pd(d.date).getDay() === k).map(M.sleepScore)));
  const best = byWd.indexOf(Math.max(...byWd.filter(v=>v!=null))), worst = byWd.indexOf(Math.min(...byWd.filter(v=>v!=null)));
  if (best >= 0 && worst >= 0 && byWd[best] - byWd[worst] >= 5) push("neutral", "☾", `Best sleep on ${WD[best]} nights`, `Average score ${byWd[best].toFixed(0)} on ${WD[best]} vs ${byWd[worst].toFixed(0)} on ${WD[worst]} (90 days).`);
  return out;
}
function minutesFrom18(d){ let m = d.getHours()*60 + d.getMinutes() - 18*60; if (m < 0) m += 1440; return m; }

function deltaHTML(v, b, {better = "up", unit = "", digits = 0, pctMode = false} = {}){
  if (v == null || b == null) return `<span class="delta">no baseline</span>`;
  const d = pctMode ? pct(v, b) : v - b;
  if (Math.abs(d) < (pctMode ? 1 : 0.5 * 10 ** -digits)) return `<span class="delta">= 30-day avg</span>`;
  const good = (d > 0) === (better === "up");
  return `<span class="delta"><i style="background:${good ? C.good : C.serious}"></i><span class="ar">${d > 0 ? "▲" : "▼"}</span>${Math.abs(d).toFixed(pctMode ? 0 : digits)}${pctMode ? "%" : unit} vs 30d</span>`;
}
function readinessColor(v){ return v == null ? C.muted : v >= 67 ? C.good : v >= 34 ? C.warn : C.bad; }
function card(cls, title, color, right, body){
  return `<section class="card ${cls||""}" tabindex="0"><div class="kicker"><h2>${color ? `<span class="dot" style="background:${color}"></span>` : ""}${title}</h2>${right || ""}</div>${body}</section>`;
}
function rangeSeg(){
  const opts = [[7,"7D"],[30,"30D"],[90,"90D"],[365,"1Y"]];
  return `<div class="seg" role="tablist">${opts.map(([v,l]) => `<button data-range="${v}" class="${state.range===v?"on":""}">${l}</button>`).join("")}</div>`;
}
function rangeDays(){ return lastN(state.range); }
// For long ranges aggregate to weekly means so bars stay legible
function aggregate(days, fns){
  if (state.range <= 90) return { xs: days.map(d => pd(d.date)), cols: fns.map(f => days.map(f)), days, weekly: false };
  const weeks = [];
  days.forEach(d => { const dt = pd(d.date), k = new Date(dt); k.setDate(dt.getDate() - ((dt.getDay()+6)%7)); const key = k.getTime(); let w = weeks[weeks.length-1]; if (!w || w.key !== key) weeks.push(w = {key, d: k, items: []}); w.items.push(d); });
  return { xs: weeks.map(w => w.d), cols: fns.map(f => weeks.map(w => mean(w.items.map(f)))), weeks, weekly: true };
}
function actRow(a, i){

</div></button>`;
}

    ["Steps", M.steps, v => fNum(v), "up"], ["Stress", M.stress, v => v.toFixed(0), "down"], ["VO₂ max", M.vo2, v => v.toFixed(1), "up"],
    ["Recovery", M.ready, v => v.toFixed(0) + "%", "up"], ["Body Battery peak", M.bb, v => v.toFixed(0), "up"],

    ${card("tv-12 span-3", "Year at a glance", C.ink2, `<div class="seg">${Object.entries(heatOpts).map(([k,v])=>`<button data-heat="${k}" class="${state.heat===k?"on":""}">${v[0]}</button>`).join("")}</div>`, `<div class="heat" id="c-heat"></div>`)}
    ${card("tv-12 span-3", "Personal bests · 12 months", C.ink2, "", `<div class="records">
      ${bSteps ? rec("Most steps", fNum(bSteps.steps), fDay(pd(bSteps.date))) : ""}
      ${bSleep ? rec("Best sleep score", bSleep.sleep.score, fDay(pd(bSleep.date)) + " · " + fDur(bSleep.sleep.total)) : ""}

/* ============================================================ Vitals Age (animated sphere + pace of aging) */
function vaPalette(){
  const f = DATA.fitness || {}, diff = f.chrono ? f.chrono - f.age : 0;
  return diff >= 1.5 ? ["#0b7d43", "#2fe48f", "#c9ffe5"] : diff > -1.5 ? ["#7a6a0c", "#f0cf3f", "#fff3bf"] : ["#8a3510", "#ff8a3d", "#ffd9c4"];
}
function paceBar(p, label){
  const lo = -1, hi = 3, n = 61, pos = clamp((p - lo) / (hi - lo), 0, 1);
  let ticks = "";
  for (let i = 0; i < n; i++) {
    const x = i / (n - 1), dd = x - pos;
    const op = 0.16 + 0.7 * Math.exp(-dd * dd / 0.006), h = 12 + 14 * Math.exp(-dd * dd / 0.003);
    ticks += `<i style="height:${h.toFixed(1)}px;opacity:${op.toFixed(2)}"></i>`;

  if (t.id === "key-back") { renderChat(); return; }
  if (t.id === "key-paste") { try { const v = await navigator.clipboard.readText(); if (v) { $c("#key-in").value = v.trim(); } } catch (er) { $c("#key-in").focus(); } return; }
  if (t.id === "key-del") { try { localStorage.removeItem("vitals.geminiKey"); sessionStorage.removeItem("vitals.models"); } catch (er) {} renderKeySetup(); return; }
  if (t.id === "key-save") {
    const v = ($c("#key-in").value || "").trim();
    if (!v) { if (getKey()) renderChat(); return; }
    t.textContent = "Checking…";
    try {
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1", { headers: { "x-goog-api-key": v } });
      if (!r.ok) { renderKeySetup("Gemini rejected that key (HTTP " + r.status + ")."); return; }
      localStorage.setItem("vitals.geminiKey", v); sessionStorage.removeItem("vitals.models"); renderChat();
    } catch (er) { renderKeySetup("Couldn't reach Gemini to check the key. A VPN is needed in mainland China."); }
  }
});
$c("#chat-in").addEventListener("input", growInput);
$c("#chat-in").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(e.target.value); } });
// Fit the chat overlay to the *visible* area: when the iOS keyboard opens, the panel shrinks above it
function fitChat(){
  const vv = window.visualViewport;
  if (!vv || !chat.classList.contains("open")) { chat.style.top = ""; chat.style.height = ""; chat.style.bottom = ""; return; }
  chat.style.top = vv.offsetTop + "px";
  chat.style.height = vv.height + "px";
  chat.style.bottom = "auto";
}
if (window.visualViewport) { visualViewport.addEventListener("resize", fitChat); visualViewport.addEventListener("scroll", fitChat); }
chat.addEventListener("focusin", () => setTimeout(fitChat, 50));
chat.addEventListener("focusout", () => setTimeout(fitChat, 250));

/* ============================================================ render */
function renderTabs(){
  const nav = $("#tabs");
  if (nav.children.length) { nav.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === state.view)); tickClock(); return; }
  const lab = {today:"Today",sleep:"Sleep",heart:"Heart",activity:"Activity",trends:"Trends"};
  $("#tabs").innerHTML = `<div class="rail-logo">${WORDMARK}</div>` + VIEWS.map(v => `<button class="tab ${state.view===v?"on":""}" data-view="${v}"><svg viewBox="0 0 24 24">${ICONS[v]}</svg>${lab[v]}</button>`).join("")
    + `<div class="rail-extra"><div class="clock" id="clock"></div><div id="railSync"></div><div style="margin-top:.6rem;opacity:.7">Hold OK for ambient</div></div>`;
  tickClock();
}
function tickClock(){ const c = $("#clock"); if (c) c.textContent = fClock(new Date()); }
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
let renderSeq = 0;
function render(keepFocus){
  if (!DATA) return;
  document.documentElement.style.setProperty("--glow", hexA(readinessColor(TODAY.readiness?.score ?? null), TV ? .16 : .24));
  const v = V[state.view]();
  const app = $("#app"), sc = TV ? app : null;
  const keepY = keepFocus ? (sc ? sc.scrollTop : window.pageYOffset) : null;
  if (keepFocus) app.style.minHeight = app.offsetHeight + "px";   // stop the page collapsing while charts redraw
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  const stale = gen && (Date.now() - gen) > 36 * 36e5;
  $("#app").innerHTML = `<header class="top"><div><div class="brandrow">${WORDMARK}${DATA.profile?.name ? "· " + esc(DATA.profile.name).toUpperCase() : ""}</div>
      <h1>${state.view === "today" ? fDay(new Date()) : ""}${state.view !== "today" ? "" : ""}</h1></div>
      <div class="meta">${DATA.source === "sample" ? `<span class="badge warn">Sample data</span><br>` : ""}${stale ? `<span class="badge warn">Sync overdue</span><br>` : ""}Synced ${gen ? relTime(gen) : "–"}<br>${esc(DATA.profile?.device || "")}</div></header>
    <div class="view${keepFocus ? " still" : ""}">${v.html}</div>`;
  if (state.view !== "today") $("#app header.top h1").remove();
  const rs = $("#railSync"); if (rs) rs.textContent = "Synced " + (gen ? relTime(gen) : "–");
  const token = ++renderSeq;
  hideTip();
  const restore = () => { if (keepY == null) return; if (sc) sc.scrollTop = keepY; else window.scrollTo(0, keepY); };
  restore();
  requestAnimationFrame(() => {
    if (token !== renderSeq) return;
    v.mount(); mountSpheres(); restore();
    app.style.minHeight = "";
    restore();
    if (TV && !keepFocus) focusFirst();
  });
  renderTabs();
}

/* ============================================================ events */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { go(b.dataset.view); }
  else if (b.dataset.range) { state.range = +b.dataset.range; saveState(); render(true); restoreFocus(`[data-range="${b.dataset.range}"]`); }
  else if (b.dataset.heat) { state.heat = b.dataset.heat; render(true); restoreFocus(`[data-heat="${b.dataset.heat}"]`); }
  else if (b.dataset.month) { state.month = b.dataset.month; render(true); restoreFocus(`[data-month="${b.dataset.month}"]`); }
  else if (b.dataset.ask) { openChat(b.dataset.ask); }
  else if (b.dataset.act) { openActivity(+b.dataset.act); }
  else if (b.dataset.close != null) { closeActivity(); }
  else if (b.dataset.metric) { state.actMetric = b.dataset.metric; }
  else if (b.dataset.vaperiod) { state.vaPeriod = +b.dataset.vaperiod; try { localStorage.setItem("vitals.vaPeriod", state.vaPeriod); } catch (e) {} render(true); restoreFocus(`[data-vaperiod="${b.dataset.vaperiod}"]`); }
});
function go(view){ state.view = view; history.replaceState(null, "", "#" + view); window.scrollTo(0, 0); $("#app").scrollTop = 0; render(); }
function restoreFocus(sel){ if (TV) requestAnimationFrame(() => { const el = $(sel); if (el) el.focus({preventScroll: true}); }); }
function saveState(){ try { localStorage.setItem("vitals.range", state.range); } catch(e) {} }
try { const v = +localStorage.getItem("vitals.vaPeriod"); if ([91, 183, 365].includes(v)) state.vaPeriod = v; } catch (e) {}
try { const r = +localStorage.getItem("vitals.range"); if ([7,30,90,365].includes(r)) state.range = r; } catch(e) {}
addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== state.view) { state.view = v; window.scrollTo(0, 0); render(); } });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { fitTV(); render(true); }, 150); });

/* ---------- TV: spatial navigation + ambient mode ---------- */
function focusables(){
  if (sheetOpen()) return [...document.querySelectorAll("#sheet .back, #sheet .card[tabindex], #sheet .seg button")].filter(el => el.offsetParent !== null);
  // cards that hold activity rows aren't focus targets themselves: the rows are
  return [...document.querySelectorAll("nav.tabs .tab, #app .seg button, #app .card[tabindex], #app .tile[tabindex], #app .act")]
    .filter(el => el.offsetParent !== null && !(el.classList.contains("card") && el.querySelector(".act")));
}
function ensureVisible(el){
  const sc = el.closest("#sheet") || el.closest("#app");
  if (!sc || el.closest("nav")) return;
  const r = el.getBoundingClientRect(), m = rem() * 2.6, vh = innerHeight;
  let d = 0;
  if (r.height > vh - 2 * m || r.top < m) d = r.top - m;
  else if (r.bottom > vh - m) d = r.bottom - (vh - m);
  if (Math.abs(d) > 1) sc.scrollTo({top: sc.scrollTop + d, behavior: "smooth"});
}
function focusFirst(){ if (sheetOpen()) { const b = $("#sheet .back"); if (b) b.focus(); return; } const t = document.querySelector(".tab.on"); t && t.focus(); }
function moveFocus(dir){
  const cur = document.activeElement, list = focusables();
  if (!cur || !list.includes(cur)) { focusFirst(); return; }
  const a = cur.getBoundingClientRect(), ac = {x: a.left + a.width/2, y: a.top + a.height/2};
  let best = null, bs = Infinity;
  list.forEach(el => {
    if (el === cur || (cur.closest(".act") && el.contains(cur))) return;
    const b = el.getBoundingClientRect(), bc = {x: b.left + b.width/2, y: b.top + b.height/2};
    let main, cross;
    if (dir === "left")  { if (b.right > a.left + 4) return; main = a.left - b.right; cross = Math.abs(bc.y - ac.y); }
    if (dir === "right") { if (b.left < a.right - 4) return; main = b.left - a.right; cross = Math.abs(bc.y - ac.y); }
    if (dir === "up")    { if (b.bottom > a.top + 4) return; main = a.top - b.bottom; cross = Math.abs(bc.x - ac.x); }
    if (dir === "down")  { if (b.top < a.bottom - 4) return; main = b.top - a.bottom; cross = Math.abs(bc.x - ac.x); }
    const sc = main + cross * 2;
    if (sc < bs) { bs = sc; best = el; }
  });
  if (best) { best.focus({preventScroll:true}); ensureVisible(best); }
}
let ambientTimer = null, idleTimer = null, ambientIdx = 0, okDown = 0;
const AMBIENT_MS = 20000, IDLE_MS = 120000;
function startAmbient(){
  if (sheetOpen()) closeActivity();
  document.body.classList.add("ambient"); ambientIdx = VIEWS.indexOf(state.view);
  const bar = $("#ambientBar");
  const step = () => {
    bar.style.transition = "none"; bar.style.width = "0";
    requestAnimationFrame(() => { bar.style.transition = `width ${AMBIENT_MS}ms linear`; bar.style.width = "100%"; });
    const app = $("#app"); app.scrollTop = 0;
    // slowly scroll long views so every card gets screen time
    const max = app.scrollHeight - app.clientHeight;
    if (max > 0) setTimeout(() => app.scrollTo({top: max, behavior: "smooth"}), AMBIENT_MS * 0.5);
  };
  state.view = VIEWS[ambientIdx]; render(true); step();
  ambientTimer = setInterval(() => { ambientIdx = (ambientIdx + 1) % VIEWS.length; state.view = VIEWS[ambientIdx]; render(true); step(); }, AMBIENT_MS);
}
function stopAmbient(){ if (!ambientTimer) return false; clearInterval(ambientTimer); ambientTimer = null; document.body.classList.remove("ambient"); focusFirst(); return true; }
function resetIdle(){ clearTimeout(idleTimer); if (TV) idleTimer = setTimeout(startAmbient, IDLE_MS); }
document.addEventListener("keydown", e => { if (!TV && e.key === "Escape") { if (chat.classList.contains("open")) closeChat(); else if (sheetOpen()) closeActivity(); } });
document.addEventListener("keydown", e => {
  if (!TV && !/^Arrow/.test(e.key)) return;
  if (stopAmbient()) { e.preventDefault(); resetIdle(); return; }
  resetIdle();
  const k = e.key;
  if (k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowUp" || k === "ArrowDown") { if (!TV) return; e.preventDefault(); moveFocus(k.slice(5).toLowerCase()); }
  else if (k === "Enter" || k === " ") {
    if (!okDown) okDown = Date.now();
    else if (Date.now() - okDown > 900) { okDown = 0; e.preventDefault(); startAmbient(); return; }
    const el = document.activeElement; if (el && !/BUTTON/.test(el.tagName)) { e.preventDefault(); }
  }
  else if (k === "Escape" && sheetOpen()) { e.preventDefault(); closeActivity(); }
  else if ((k === "Escape" || k === "Backspace" || k === "GoBack") && TV) { if (!document.activeElement?.closest("nav")) { e.preventDefault(); focusFirst(); } }
});
// Hooks for the Android TV wrapper app
window.tvBack = () => {           // remote Back: stop ambient, else return to the menu, else let the app exit
  if (stopAmbient()) { resetIdle(); return true; }
  if (sheetOpen()) { closeActivity(); resetIdle(); return true; }
  resetIdle();
  if (!document.activeElement?.closest("nav")) { focusFirst(); $("#app").scrollTo({top: 0, behavior: "smooth"}); return true; }
  return false;
};
window.tvAmbient = () => { if (!ambientTimer) startAmbient(); else { stopAmbient(); resetIdle(); } };
window.tvResume = () => { if (DATA && Date.now() - new Date(DATA.generated) > 36e5) load(); };
document.addEventListener("keyup", e => { if (e.key === "Enter" || e.key === " ") okDown = 0; });
document.addEventListener("focusin", e => { if (!TV) return; const t = e.target.closest(".tab"); if (t && t.dataset.view && t.dataset.view !== state.view && !ambientTimer) { /* switch on focus for snappy TV feel */ go(t.dataset.view); requestAnimationFrame(() => $(`.tab[data-view="${t.dataset.view}"]`)?.focus()); } });

/* ============================================================ load */
const bootAt = Date.now();
function hideSplash(){ const sp = $("#splash"); if (!sp || sp.classList.contains("gone")) return; setTimeout(() => sp.classList.add("gone"), Math.max(0, 900 - (Date.now() - bootAt))); }
async function load(){
  try {
    const r = await fetch("data.json?t=" + Math.floor(Date.now() / 6e5), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    setData(await r.json());
    render();
    hideSplash();
  } catch (e) {
    if (!DATA) { $("#app").innerHTML = `<div class="loading">Couldn't load data.json (${esc(e.message)})</div>`; hideSplash(); }
  }
}
load();
setInterval(tickClock, 15000);
setInterval(load, 30 * 60 * 1000); // TVs stay on: refresh data every 30 min
document.addEventListener("visibilitychange", () => { if (!document.hidden && DATA && Date.now() - new Date(DATA.generated) > 3 * 36e5) load(); });
resetIdle();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
